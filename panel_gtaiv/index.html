<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AERO Panel</title><link rel="icon" href="img/logo.png"><link rel="stylesheet" href="fonts/poppins.css"><link rel="stylesheet" href="style.css"></head>
<body>
<div class="bg"></div>

<!-- Connexion -->
<main id="login" class="screen">
  <section class="box">
    <img src="img/logo.png" alt="AERO">
    <h1>Connexion</h1>
    <p class="muted">Gère ton serveur FiveM depuis ton espace client.</p>
    <label>E-mail</label><input id="mail" type="email" placeholder="E-mail" autocomplete="email">
    <label>Mot de passe</label><input id="pass" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button class="btn p" id="go"><span>Se connecter</span></button>
  </section>
</main>

<!-- Application -->
<div id="app" class="screen hidden layout">
  <aside class="side">
    <img class="logo" src="img/logo.png" alt="AERO">
    <div class="sec">Mon espace</div>
    <nav id="menu"></nav>
    <div class="bottom"><a class="nav" href="#" id="out"><span>Déconnexion (Admin)</span></a></div>
  </aside>
  <main class="main" id="view"></main>
</div>
<script src="app.js"></script>
</body></html>
