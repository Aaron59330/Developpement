# ═════════════════════════════════════════════════════════════════════════════
#  server.cfg : MODÈLE de la base AERO (remplace les valeurs en MAJUSCULES par les tiennes)
#  Les réglages marqués « panel » peuvent aussi se modifier dans le panel web (Gestion Serveur) :
#  le panel est alors prioritaire sur la valeur écrite ici.
# ═════════════════════════════════════════════════════════════════════════════

# ───────── 1. Réseau ─────────
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 48                      # panel (Gestion Serveur → places) ; au-delà de 48 : abonnement Element Club
set onesync_enableInfinity 1          # OneSync (obligatoire : positions, entités, nombre de joueurs)
## [txAdmin CFG validator] : onesync se règle uniquement dans les paramètres de txAdmin.
# sv_listingIpOverride "IP_PUBLIQUE_DU_VPS"   # à décommenter seulement si ton serveur n'apparaît pas dans la liste
sv_useDirectListing true

# ───────── 2. Licence FiveM et base de données ─────────
sv_licenseKey "METTRE_TA_CLE_ICI"     # clé gratuite sur https://portal.cfx.re/servers/registration-keys
set steam_webApiKey ""                # facultatif
set mysql_connection_string "server=IP_OU_HOTE_MYSQL;port=3306;uid=UTILISATEUR;password=MOT_DE_PASSE;database=NOM_DE_LA_BASE"
set mysql_ui false

# ───────── 3. Liaison avec le panel web AERO ─────────
# pickax_panel est démarré par « ensure [dev] » (resources.cfg). Toujours « set », jamais « setr » (la clé ne doit pas aller aux joueurs).
set aero_panel_url "https://panel.aerofivem.site"      # adresse du panel (https:// recommandé)
set aero_panel_key ""                              # ta clé AERO (panel → Clé AERO)

# Autorisations d'écriture (sandbox FiveM) : le panel met à jour le thème et l'écran de chargement de pickax_core,
# et l'éditeur de fichiers peut modifier les ressources listées (une ligne par ressource).
add_filesystem_permission pickax_basetools write pickax_core
add_filesystem_permission pickax_basetools write pickax_theme
add_filesystem_permission pickax_panel write pickax_core

# ───────── 4. Fiche du serveur dans la liste FiveM ─────────
# Tout ce bloc se règle dans le panel (Gestion Serveur) : il remplace ces valeurs sans redémarrage.
sets sv_projectName "^4BlueBay RP 🌊 ^7| 👥 ^4Free-Acces 👥^7| ❗^4RP Sérieux ❗^7| 📌^4discord.gg/bluebayrp 📌"
sv_hostname "^4BlueBay RP 🌊 ^7| 👥 ^4Free-Acces 👥^7| ❗^4RP Sérieux ❗^7| 📌^4discord.gg/bluebayrp 📌"
sets sv_projectDesc "FreeAccess, Rp sérieux, Contenue unique & Optimiser 150 fps !"
sets discord "discord.gg/bluebayrp"
sets tags "roleplay, rp, fr, qc, blg, rp strict, esx, custom cars, custom, drugs, reallife, serious, discord, economy, serious rp, seriousrp, fivem, customcars, custom scripts, realistic, life, lspd, cops, jobs, vrp, freeaccess, white, list, vehicules import, vanilla, vehicules, france, 64, slots, 64 slots, default, police, cars, ems, fun, racing, mafia, drifting, 100 slots, 100"
sets locale "fr-FR"
sets banner_detail "https://r2.fivemanage.com/g75InPQojA3QWv8YsdaUk/BannerFiveM.png"
sets banner_connecting "https://r2.fivemanage.com/g75InPQojA3QWv8YsdaUk/Banner.png"
load_server_icon "logo.png"           # PNG 96×96 à la racine du serveur (non modifiable à distance)
sets credit "Base développé par Pickax"
sets gametype "Pickax"
sets mapname "Los Santos"

# ───────── 5. Sécurité ─────────
set sv_requestParanoia 3
sv_authMinTrust 4
sv_scriptHookAllowed 0
sv_endpointprivacy true
set ox:ignoreSecurityAdvisory ["stateBagStrictMode"]

# ───────── 6. Droits (ACE) ─────────
add_ace resource.chat command allow
add_ace resource.es_extended command allow
add_ace resource.pickax_panel command allow       # le panel applique nom, description, tags… (sets, sv_hostname) : sans cette ligne « Access denied for command sets »
add_principal group._dev group.superadmin
add_principal group.superadmin group.admin
# Ajoute tes comptes staff : ton identifiant FiveM (txAdmin → Joueurs, ou F8 → « license: ») puis le groupe
# add_principal identifier.license:TON_IDENTIFIANT group._dev

# ───────── 7. Inventaire (ox_inventory) et langue ─────────
setr ox:locale "fr"

# ───────── 7 bis. Voix (pma-voice) ─────────
setr voice_defaultCycle "HOME"       # changer la portée de la voix (F11 est prise par le menu staff)
setr inventory:framework "esx"
setr inventory:target false
setr inventory:slots 50
setr inventory:weight 30000
setr inventory:dropmarker 2
setr inventory:dropprops true
setr inventory:screenblur 1           # 1 = flou derrière l'inventaire, 0 = aucun flou
setr inventory:blurstrength 100       # 0 à 100 (100 = flou maximum) ; baisse-le si l'inventaire te semble flou
setr inventory:blurdelay 400          # ms : réapplique le flou après l'activation du personnage
setr inventory:blurfade 80            # ms : durée d'apparition du flou (80 = quasi instantané)

# ───────── 8. CDN de fichiers (facultatif) ─────────
# À décommenter UNIQUEMENT si tu utilises un service de CDN (Adhesive) avec ta vraie clé ; sinon laisse en commentaire.
# fileserver_add ".*" "http://cdn.vibegames.net/TA_CLE_CDN/files"
# adhesive_cdnKey "TA_CLE_CDN"

# ───────── 9. Démarrage des ressources (toujours en dernier) ─────────
exec "resources.cfg"
