<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://cfx-nui-bluebay_config/theme.css">
    <link rel="stylesheet" href="assets/css/card.css">
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>
    <div id="holder">
      <div class="idcard type-id" id="id-card">
        <div class="guilloche"></div>
        <div class="card-top">
          <span class="card-flag"></span>
          <div class="card-title"><b>État de San Andreas</b><small id="cTitle">Carte nationale d'identité</small></div>
          <span class="card-no">N° <em id="cNo">000000</em></span>
        </div>
        <div class="card-body">
          <div class="photo-col">
            <div class="photo" id="photo">
              <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-3.3 0-8 1.7-8 5v1h16v-1c0-3.3-4.7-5-8-5z"/></svg>
              <img class="head-img" id="headImg" alt="">
            </div>
            <div class="holo"></div>
          </div>
          <div class="card-fields">
            <div class="cf done" data-f="lastname"><small>Nom</small><b id="cLast"></b></div>
            <div class="cf done" data-f="firstname"><small>Prénom</small><b id="cFirst"></b></div>
            <div class="cf-row">
              <div class="cf done" data-f="sex"><small>Sexe</small><b id="cSex"></b></div>
              <div class="cf done" data-f="height"><small>Taille</small><b id="cHeight"></b></div>
            </div>
            <div class="cf-row">
              <div class="cf done" data-f="dob"><small>Naissance</small><b id="cDob"></b></div>
              <div class="cf done" data-f="nat"><small id="cExtraLabel">Nationalité</small><b id="cNat"></b><div class="badges" id="licenses"></div></div>
            </div>
          </div>
        </div>
        <div class="card-foot">
          <div class="card-sign"><small>Signature</small><span id="signature"></span></div>
          <div class="mrz" id="mrz"></div>
        </div>
      </div>
    </div>
    <script src="assets/js/init.js" type="text/javascript"></script>
  </body>
</html>
