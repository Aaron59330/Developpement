<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Menu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap" class="hidden" data-style="noir" data-size="md">
  <div id="col">
  <div id="menu" class="card">
    <img id="banner" src="banner.jpg" alt="">
    <div class="head">
      <div class="ttl"><h1 id="title"></h1><p id="sub"></p></div>
      <span id="count" class="pill"></span>
    </div>
    <div id="items"></div>
    <div class="keys"><span><b>↑↓</b> Naviguer</span><span><b>←→</b> Modifier</span><span><b>Entrée</b> Valider</span><span><b>Retour</b> Fermer</span></div>
  </div>
  <div id="desc" class="desc hidden"></div>
  </div>
  <div id="info" class="card info hidden"></div>
</div>
<div id="dlgwrap" class="hidden" data-style="noir" data-size="md">
  <div id="dlg" class="card">
    <div class="dl-head">
      <span class="dl-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 7.5l3 3"/></svg></span>
      <div class="dl-ttl"><h2 id="dl-title"></h2><p id="dl-hint"></p></div>
    </div>
    <div class="dl-field"><input id="dl-input" type="text" autocomplete="off" spellcheck="false"><span id="dl-count"></span></div>
    <div id="dl-err" class="dl-err hidden"></div>
    <div class="dl-actions">
      <button id="dl-cancel" type="button"><kbd>Échap</kbd> Annuler</button>
      <button id="dl-ok" type="button" class="primary"><kbd>Entrée</kbd> Valider</button>
    </div>
  </div>
</div>
<script src="snd.js"></script>
<script src="script.js"></script>
</body>
</html>
