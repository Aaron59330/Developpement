<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cfx-nui-pickax_theme/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickax</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hud-container">
        <!-- Soif -->
        <div class="hud-element">
            <svg class="hud-circle" viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="15" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4"></circle>
                <circle cx="20" cy="20" r="15" fill="none"  stroke-width="4" class="progress" style="stroke:var(--pk-accent,var(--pk-accent,#fdc27d));stroke-dasharray: 94; stroke-dashoffset: 50;"></circle>
            </svg> <!-- 1E90FF-->
            <div class="hud-icon"><svg class="fa" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M192 512C86 512 0 426 0 320C0 228.8 130.2 57.7 166.6 11.7C172.6 4.2 181.5 0 191.1 0h1.8c9.6 0 18.5 4.2 24.5 11.7C253.8 57.7 384 228.8 384 320c0 106-86 192-192 192zM96 336c0-8.8-7.2-16-16-16s-16 7.2-16 16c0 61.9 50.1 112 112 112c8.8 0 16-7.2 16-16s-7.2-16-16-16c-44.2 0-80-35.8-80-80z"/></svg></div>
        </div>
        <!-- Faim -->
        <div class="hud-element">
            <svg class="hud-circle" viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="15" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4"></circle>
                <circle cx="20" cy="20" r="15" fill="none"  stroke-width="4" class="progress" style="stroke:var(--pk-accent,var(--pk-accent,#fdc27d));stroke-dasharray: 94; stroke-dashoffset: 30;"></circle>
            </svg> <!--FF4500 -->
            <div class="hud-icon"><svg class="fa" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path d="M416 0C400 0 288 32 288 176V288c0 35.3 28.7 64 64 64h32V480c0 17.7 14.3 32 32 32s32-14.3 32-32V352 240 32c0-17.7-14.3-32-32-32zM64 16C64 7.8 57.9 1 49.7 .1S34.2 4.6 32.4 12.5L2.1 148.8C.7 155.1 0 161.5 0 167.9c0 45.9 35.1 83.6 80 87.7V480c0 17.7 14.3 32 32 32s32-14.3 32-32V255.6c44.9-4.1 80-41.8 80-87.7c0-6.4-.7-12.8-2.1-19.1L191.6 12.5c-1.8-8-9.3-13.3-17.4-12.4S160 7.8 160 16V150.2c0 5.4-4.4 9.8-9.8 9.8c-5.1 0-9.3-3.9-9.8-9L127.9 14.6C127.2 6.3 120.3 0 112 0s-15.2 6.3-15.9 14.6L83.7 151c-.5 5.1-4.7 9-9.8 9c-5.4 0-9.8-4.4-9.8-9.8V16zm48.3 152l-.3 0-.3 0 .3-.7 .3 .7z"/></svg></div>
        </div>
    </div>
    

    <!-- Vie (sous la minimap) -->
    <div class="health-hud" id="healthHud">
        <div class="hh-bar" id="hhBar">
            <div class="hh-ghost" id="hhGhost"></div>
            <div class="hh-fill" id="hhFill"></div>
            <div class="hh-ticks"></div>
            <div class="hh-armor" id="hhArmor"><div class="hh-armor-fill" id="hhArmorFill"></div></div>
            <svg class="hh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.6 1 4.6 2.6h2C14 6 15.6 5 17.6 5 21 5 23.1 8.4 21.6 11.8 19.5 16.4 12 21 12 21z" fill="currentColor"/></svg>
            <span class="hh-val" id="hhVal">100</span>
        </div>
    </div>

    <!-- Bandeau du HUD staff (haut de l'écran, piloté par le menu admin) -->
    <div class="staff-bar" id="staffBar"></div>
    <!-- Bandeau « zone safe » (sous le HUD staff ; piloté par pickax_core via l'évènement pickax:safezone) -->
    <div class="safezone" id="safeZone">
        <div class="sz-ico"><svg viewBox="0 0 24 24"><path d="M12 2.5 4 5.6v5.7c0 4.9 3.3 8.7 8 10.2 4.7-1.500 8-5.300 8-10.200V5.600z"/><path d="m8.600 12.200 2.500 2.500 4.600-5"/></svg></div>
        <div class="sz-txt"><b>ZONE SAFE</b><span>Vous êtes protégé · combat et armes désactivés</span></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
