<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cfx-nui-pickax_theme/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickax</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="hud-container">
        <!-- Soif -->
        <div class="hud-element">
            <svg class="hud-circle" viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="15" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4"></circle>
                <circle cx="20" cy="20" r="15" fill="none"  stroke-width="4" class="progress" style="stroke:var(--pk-accent,var(--pk-accent,#00a4ff));stroke-dasharray: 94; stroke-dashoffset: 50;"></circle>
            </svg> <!-- 1E90FF-->
            <div class="hud-icon"><i class="fa-solid fa-droplet"></i></div>
        </div>
        <!-- Faim -->
        <div class="hud-element">
            <svg class="hud-circle" viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="15" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4"></circle>
                <circle cx="20" cy="20" r="15" fill="none"  stroke-width="4" class="progress" style="stroke:var(--pk-accent,var(--pk-accent,#00a4ff));stroke-dasharray: 94; stroke-dashoffset: 30;"></circle>
            </svg> <!--FF4500 -->
            <div class="hud-icon"><i class="fa-solid fa-utensils"></i></div>
        </div>
    </div>
    

    <!-- Vie (sous la minimap) -->
    <div class="health-hud" id="healthHud">
        <div class="hh-bar" id="hhBar">
            <div class="hh-ghost" id="hhGhost"></div>
            <div class="hh-fill" id="hhFill"></div>
            <div class="hh-ticks"></div>
            <div class="hh-armor" id="hhArmor"><div class="hh-armor-fill" id="hhArmorFill"></div></div>
            <svg class="hh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.6 1 4.6 2.6h2C14 6 15.6 5 17.6 5 21 5 23.1 8.4 21.6 11.8 19.5 16.4 12 21 12 21z" fill="currentColor"/></svg>
            <span class="hh-val" id="hhVal">100</span>
        </div>
    </div>

    <!-- Bandeau du HUD staff (haut de l'écran, piloté par le menu admin) -->
    <div class="staff-bar" id="staffBar"></div>
    <!-- Bandeau « zone safe » (sous le HUD staff ; piloté par pickax_core via l'évènement pickax:safezone) -->
    <div class="safezone" id="safeZone">
        <div class="sz-ico"><svg viewBox="0 0 24 24"><path d="M12 2.5 4 5.6v5.7c0 4.9 3.3 8.7 8 10.2 4.7-1.500 8-5.300 8-10.200V5.600z"/><path d="m8.600 12.200 2.500 2.500 4.600-5"/></svg></div>
        <div class="sz-txt"><b>ZONE SAFE</b><span>Vous êtes protégé · combat et armes désactivés</span></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
