<html lang="en"><head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/css.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <script src="https://kit.fontawesome.com/20f4f1f631.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">

    <link href="css/animate.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
</head>
<body>
    <div id="ui">
        <div id="infos">
            <div class="info-server" >
                <div class="linetop">
                <div class="container-server">
                    <div class="g1">
                        <div class="g1-content">
                            <img class="imagegroup" src="">
                            <span class="countgg" id=""></span><span class=""></span>
                        </div>
                    </div>
                    </div>
                    <div class="g2">
                        <div class="g2-content">
                            <img class="imageplayer" src="">
                            <span class="" id=""></span>
                        </div>
                    </div>
                    <div class="g3">
                        <div class="g3-content">
                            <span class="server" id="servername">BLUEBAY</span>
                            <span class="discordgg" id="discord">DISCORD.GG/BLUEBAYRP</span>
                        </div>
                    </div>
                    <div class="g4">
                        <div class="g4-content">
                            <img class="logo" src="img/logo.png">
                        </div>
                    </div>
                </div>
            </div>
            <div class="info">
                <div class="linecash">
                <div class="container">
                    <img class="imagecash" src="img/money.png">
                    <!-- <span class="state" id="money">0</span> -->
                    <span class="state" id="money">0$</span>
                </div>
                </div>
            </div>
            <div class="info">
                <div class="lineblack">
                <div class="container">
                    <img class="imageblack" src="img/black_money.png">
                    <!-- <span class="state" id="black_money">0</span> -->
                    <span class="state" id="black_money">0$</span>
                </div>
                </div>
            </div>
            <div class="info">
                <div class="linebank">
                <div class="container">
                    <img class="imagebank" src="img/bank.png">
                    <!-- <span class="state" id="bank">0</span> -->
                    <span class="state" id="bank">0$</span>
                </div>
            </div>
            </div>
    </div>
    <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
    <script src="js/main.js"></script>

    <div id="app"></div>
    </body>
</html>
