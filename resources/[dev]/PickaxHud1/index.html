<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickax</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="hud-container">
        <!-- Soif -->
        <div class="hud-element">
            <svg class="hud-circle" viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="15" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4"></circle>
                <circle cx="20" cy="20" r="15" fill="none" stroke="#00a4ff" stroke-width="4" class="progress" style="stroke-dasharray: 94; stroke-dashoffset: 50;"></circle>
            </svg> <!-- 1E90FF-->
            <div class="hud-icon"><i class="fa-solid fa-droplet"></i></div>
        </div>
        <!-- Faim -->
        <div class="hud-element">
            <svg class="hud-circle" viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="15" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4"></circle>
                <circle cx="20" cy="20" r="15" fill="none" stroke="#00a4ff" stroke-width="4" class="progress" style="stroke-dasharray: 94; stroke-dashoffset: 30;"></circle>
            </svg> <!--FF4500 -->
            <div class="hud-icon"><i class="fa-solid fa-utensils"></i></div>
        </div>
    </div>
    

    <!-- Vie (sous la minimap) -->
    <div class="health-hud" id="healthHud">
        <div class="hh-armor" id="hhArmor"><div class="hh-armor-fill" id="hhArmorFill"></div></div>
        <div class="hh-bar" id="hhBar">
            <div class="hh-fill" id="hhFill"></div>
            <svg class="hh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.6 1 4.6 2.6h2C14 6 15.600 5 17.600 5 21 5 23.100 8.400 21.600 11.800 19.500 16.400 12 21 12 21z" fill="currentColor"/></svg>
            <span class="hh-val" id="hhVal">100</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
